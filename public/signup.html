<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up – Vinayaka Car Rentals</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Takes 20 seconds. Then you can book and track your trips.</p>
    <div id="msg"></div>
    <form id="f" novalidate>
      <div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" required></div>
      <div class="field"><label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit number" required></div>
      <div class="field"><label for="email">Email <small style="font-weight:400;color:var(--muted)">(optional)</small></label><input id="email" type="email" autocomplete="email"></div>
      <div class="grid2">
        <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required></div>
      </div>
      <button class="btn btn-red btn-block" id="go" type="submit">Sign up</button>
    </form>
    <div class="alt">Already have an account? <a id="to-login" href="/login.html">Login</a></div>
  </div>
</div>
<footer id="site-footer"></footer>
<script src="/common.js"></script>
<script>
  const next = safeNext(new URLSearchParams(location.search).get('next'));
  $('#to-login').href = '/login.html?next=' + encodeURIComponent(next);
  if (Auth.token) location.replace(next);
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const m = $('#msg'); m.innerHTML = '';
    if ($('#pw').value !== $('#pw2').value) { m.innerHTML = '<div class="msg err">Passwords do not match.</div>'; return; }
    const b = $('#go'); b.disabled = true; b.textContent = 'Creating…';
    try {
      const r = await api('/api/signup', { method: 'POST', body: { name: $('#name').value, phone: $('#phone').value, email: $('#email').value, password: $('#pw').value } });
      Auth.set(r.token, r.user);
      location.href = next;
    } catch (err) {
      m.innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
      b.disabled = false; b.textContent = 'Sign up';
    }
  };
</script>
</body>
</html>
